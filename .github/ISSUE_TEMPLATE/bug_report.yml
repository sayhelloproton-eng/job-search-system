name: Bug report
description: Report a reproducible problem using synthetic data.
title: "[Bug] "
labels: ["bug"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What happened and what did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Minimal steps using synthetic/non-sensitive data.
    validations:
      required: true
  - type: input
    id: node
    attributes:
      label: Node.js version
